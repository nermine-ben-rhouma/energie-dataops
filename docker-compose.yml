services:
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: energie-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  prefect-server:
    build: .
    image: energie-ingestion
    container_name: energie-prefect-server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.prefect
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ingestion:
    build: .
    image: energie-ingestion
    container_name: energie-ingestion
    working_dir: /data
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./data:/data
      - ./monitoring:/app/monitoring
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    container_name: energie-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PLUGINS_PREINSTALL_SYNC: frser-sqlite-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring:/data/monitoring:ro

volumes:
  minio_data:
  grafana_data:
  prefect_data: